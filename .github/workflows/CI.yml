name: C++ CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}-${{ matrix.version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # ---------------- GCC ----------------
          - os: ubuntu-22.04
            compiler: gcc
            version: 10
            cc: gcc-10
            cxx: g++-10

          - os: ubuntu-22.04
            compiler: gcc
            version: 11
            cc: gcc-11
            cxx: g++-11

          - os: ubuntu-22.04
            compiler: gcc
            version: 12
            cc: gcc-12
            cxx: g++-12

          - os: ubuntu-22.04
            compiler: gcc
            version: 13
            cc: gcc-13
            cxx: g++-13

          - os: ubuntu-22.04
            compiler: gcc
            version: 14
            cc: gcc-14
            cxx: g++-14

          # ---------------- Clang ----------------
          - os: ubuntu-22.04
            compiler: clang
            version: 14
            cc: clang-14
            cxx: clang++-14

          - os: ubuntu-22.04
            compiler: clang
            version: 15
            cc: clang-15
            cxx: clang++-15

          - os: ubuntu-22.04
            compiler: clang
            version: 16
            cc: clang-16
            cxx: clang++-16

          - os: ubuntu-22.04
            compiler: clang
            version: 17
            cc: clang-17
            cxx: clang++-17

          - os: ubuntu-22.04
            compiler: clang
            version: 18
            cc: clang-18
            cxx: clang++-18

          # ---------------- Intel oneAPI ----------------
          # - os: ubuntu-22.04
          #   compiler: intel
          #   version: oneapi
          #   cc: icx
          #   cxx: icpx

          # ---------------- macOS ----------------
          - os: macos-15
            compiler: appleclang
            version: system
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------- Linux deps ----------------
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libgtest-dev \
          gcc-10 g++-10 \
          gcc-11 g++-11 \
          gcc-12 g++-12 \
          gcc-13 g++-13 \
          gcc-14 g++-14 \
          clang-14 clang-15 clang-16 clang-17 clang-18

    # ---------------- Intel oneAPI ----------------
    # - name: Install Intel oneAPI
    #   if: matrix.compiler == 'intel'
    #   uses: intel/oneapi-toolkit@v1
    #   with:
    #     components: compiler

    # ---------------- macOS deps ----------------
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake googletest ninja

    # ---------------- Configure ----------------
    - name: Configure
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DTENSOR_TOOLKIT_ENABLE_TESTS=ON \
          -G Ninja

    # ---------------- Build ----------------
    - name: Build
      run: |
        cmake --build build --config Release

    # ---------------- Test ----------------
    - name: Test
      working-directory: build
      run: |
        ctest --output-on-failure
